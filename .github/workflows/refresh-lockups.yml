name: Refresh SOL lockups

# Hourly: collects pending SOL stake lockups from mainnet-beta and pushes them
# to the Worker (mainnet-beta refuses getProgramAccounts from Cloudflare).
# Authenticated with this workflow's OIDC token; no secrets needed.
# Also runs when the collector changes, since GitHub can delay the first
# scheduled runs of a new workflow by hours.
on:
  schedule:
    - cron: "23 * * * *"
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-lockups.yml
      - scripts/refresh-lockups.ts
      - src/datasets/solana-unlocks/lockups.ts
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: refresh-lockups
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run refresh-lockups
