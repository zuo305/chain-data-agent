name = "chain-data-agent"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# Platform tables (usage log, API keys, free MCP calls, data requests).
# Created 2026-11-14, location hint Eastern North America.
[[d1_databases]]
binding = "DB"
database_name = "chain-data-agent"
database_id = "d6550e09-0818-47b7-8b35-83fea7a4e442"
migrations_dir = "migrations"

[vars]
# Wallet that receives x402 payments (shared with agent-data-platform). Paid endpoints return 503 while empty.
X402_PAY_TO = "0x2D6F7D1e969a3C6218599B348EbBBDdc7f583948"
# CAIP-2 network id: eip155:84532 = Base Sepolia (testnet), eip155:8453 = Base mainnet
# Base mainnet since 2026-11-14: payments are real USDC.
X402_NETWORK = "eip155:8453"
# Empty: use the CDP facilitator when CDP_API_KEY_ID / CDP_API_KEY_SECRET secrets
# are set (required for x402 Bazaar listing), else https://x402.org/facilitator.
X402_FACILITATOR_URL = ""
# Solana JSON-RPC endpoint. Empty = public mainnet-beta endpoint (rate limited).
# An endpoint that embeds an API key must be a Secret instead, not a var.
SOLANA_RPC_URL = ""
# Public contact email shown on the site next to the data request options
CONTACT_EMAIL = "johnzuo305@gmail.com"
# 402index.io domain verification hash (public), served at /.well-known/402index-verify.txt.
# The claim token for editing listings is kept outside the repo.
INDEX402_VERIFY_HASH = "a3663ce1ff6c448385c7ff9603710c2b8195653685fa44e2026aee640c5a7727"

[triggers]
# Daily pruning of free MCP call counters. Free plan: max 5 cron triggers per account.
crons = ["17 3 * * *"]
